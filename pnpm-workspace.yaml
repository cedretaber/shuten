packages:
  - packages/*

# pnpm 10 は依存パッケージのインストールスクリプトを既定で実行しない。
# better-sqlite3 13 はビルド済みバイナリを npm パッケージ内に同梱しており、node-gyp による
# ソースビルドは不要（許可するとビルドが走り、コンパイラのない環境で失敗する）。
# esbuild の postinstall は同梱バイナリの検証だけなので許可する。
onlyBuiltDependencies:
  - esbuild

# better-sqlite3 は意図的にビルドしない（上記の理由）。警告を抑止する
ignoredBuiltDependencies:
  - better-sqlite3
