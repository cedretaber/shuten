name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN の権限を最小に固定する。CI はリポジトリの読み取りしか必要としない
permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows は標準実行環境（仕様書 2 節）。better-sqlite3 の同梱バイナリが
        # ビルドなしで動くことの確認を兼ねる
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # 版は package.json の packageManager から読む
      - uses: pnpm/action-setup@v6

      # 版は .node-version から読む
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # better-sqlite3 が同梱のビルド済みバイナリを読み込めること（ビルドは行わない設定）
      - run: node -e "const D=require('./packages/server/node_modules/better-sqlite3'); console.log(D(':memory:').prepare('select sqlite_version() v').get())"
